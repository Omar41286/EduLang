<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="../estilos/inicioSesion.css">
</head>

<body>
    <header class="encabezadoI">
        <a href="../Index.html" class="inicioEdu">
            <h1 class="edulang"><span class="edu">Edu</span><span class="lang">Lang</span></h1>
        </a>
    </header>
    <hr class="linea">
    <main class="fondo">
        <section class="isDL">
            <div class="inicioSesion">
                <form action="secciones.html" method="post">
                    <div class="renglonSesion">
                        <label for="correo">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="icono"
                                viewBox="0 0 16 16">
                                <path
                                    d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1zm13 2.383-4.708 2.825L15 11.105zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741M1 11.105l4.708-2.897L1 5.383z" />
                            </svg>
                        </label>
                        <input id="correo" class="inInicio" type="email" name="correo" placeholder="Escribe tu correo"
                            required>
                    </div>
                    <div class="renglonSesion">
                        <label for="contrasena">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                class="icono" viewBox="0 0 16 16">
                                <path
                                    d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2m3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2M5 8h6a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1" />
                            </svg>
                        </label>
                        <input id="contrasena" class="inInicio" type="password" name="contrasena"
                            placeholder="Escribe tu contraseña" required>
                    </div>
                    <button type="submit" class="navegar">Entrar</button>
                    <p class="contraOlvi"><a href="">¿Olvidaste tu contraseña?</a></p>

                    <p class="contraOlvi"><a href="">¿Necesitas ayuda?</a></p>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
